name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: cloudflare/worker
      - run: npm run preflight
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        working-directory: cloudflare/worker
      - run: npm run typecheck
        working-directory: cloudflare/worker
      - run: npm run build
        working-directory: cloudflare/worker
